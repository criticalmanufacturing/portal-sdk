# Publication setup: .github/RELEASE-ARTIFACTS.md
name: Publish NPM Package on Release

on:
  release:
    types: [published]
concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      # Checkout
      - name: Git checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Test artifact publication checks
        run: node --test .github/scripts/release-artifacts.test.mjs
      # Needs .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Run dotnet restore
      - name: Run dotnet restore
        run: dotnet restore Cmf.CustomerPortal.Sdk.sln
      # Run dotnet build
      - name: Run dotnet build
        run: dotnet build Cmf.CustomerPortal.Sdk.sln --no-restore --configuration Release
      # Run Unit Tests
      - name: Run Unit Tests
        run: dotnet test Cmf.CustomerPortal.Sdk.sln --no-build --no-restore --configuration Release
      # Run build
      # Run build
      - name: Build Windows
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
        run: dotnet publish --configuration Release --self-contained --runtime win-x64 Cmf.CustomerPortal.Sdk.sln
      - name: Build Linux
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
        run: dotnet publish --configuration Release --self-contained --runtime linux-x64 Cmf.CustomerPortal.Sdk.sln
      # Read version
      - name: Read tool version
        uses: QwerMike/xpath-action@v1
        id: getver
        with:
          filename: src/Version.props
          expression: '/Project/PropertyGroup/Version/text()'
      - name: Validate release version
        env:
          PACKAGE_VERSION: ${{ steps.getver.outputs.result }}
        run: test "$RELEASE_TAG" = "$PACKAGE_VERSION"
      # Needs zip
      - name: Install zip
        uses: montudor/action-zip@v0.1.0
      # Generate packs
      - name: Archive Console Win64
        run: zip -X -r ../../../../../../../Cmf.CustomerPortal.Sdk.Console-${{ steps.getver.outputs.result }}.win-x64.zip .
        working-directory: src/Console/bin/Release/net10.0/win-x64/publish/
      - name: Archive Console Linux64
        run: zip -X -r ../../../../../../../Cmf.CustomerPortal.Sdk.Console-${{ steps.getver.outputs.result }}.linux-x64.zip .
        working-directory: src/Console/bin/Release/net10.0/linux-x64/publish/
      - name: Archive PowerShell
        run: zip -X -r ../../../../../../../Cmf.CustomerPortal.Sdk.PowerShell-${{ steps.getver.outputs.result }}.zip .
        working-directory: src/Powershell/bin/Release/net10.0/linux-x64/publish/
      # Add to release assets
      - name: Add Console Win64 to Release assets
        run: gh release upload "$RELEASE_TAG" "Cmf.CustomerPortal.Sdk.Console-$RELEASE_TAG.win-x64.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Console Linux64 to Release assets
        run: gh release upload "$RELEASE_TAG" "Cmf.CustomerPortal.Sdk.Console-$RELEASE_TAG.linux-x64.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add PowerShell to Release assets
        run: gh release upload "$RELEASE_TAG" "Cmf.CustomerPortal.Sdk.PowerShell-$RELEASE_TAG.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-and-verify-binaries:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Download original release binaries
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern '*.zip' --dir dist
          for archive in dist/*.zip; do unzip -tq "$archive"; done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish every binary to the registry
        shell: bash
        env:
          TARGET_IP: ${{ secrets.CRITICALMANUFACTURING_IO_IP }}
          CRITICALMANUFACTURING_IO_USER: ${{ secrets.CRITICALMANUFACTURING_IO_USER || vars.CRITICALMANUFACTURING_IO_USER }}
          CRITICALMANUFACTURING_IO_TOKEN: ${{ secrets.CRITICALMANUFACTURING_IO_TOKEN }}
        run: |
          : "${TARGET_IP:?Set CRITICALMANUFACTURING_IO_IP.}"
          : "${CRITICALMANUFACTURING_IO_USER:?Set CRITICALMANUFACTURING_IO_USER.}"
          : "${CRITICALMANUFACTURING_IO_TOKEN:?Set CRITICALMANUFACTURING_IO_TOKEN.}"
          for name in \
            "Cmf.CustomerPortal.Sdk.Console-$RELEASE_TAG.win-x64.zip" \
            "Cmf.CustomerPortal.Sdk.Console-$RELEASE_TAG.linux-x64.zip" \
            "Cmf.CustomerPortal.Sdk.PowerShell-$RELEASE_TAG.zip"; do
            curl --fail --silent --show-error --resolve "admin.criticalmanufacturing.io:443:$TARGET_IP" \
              --user "$CRITICALMANUFACTURING_IO_USER:$CRITICALMANUFACTURING_IO_TOKEN" \
              --form "packageName=$name" --form 'packageVersion=latest' \
              --form "packageFiles=@dist/$name;filename=$name" \
              'https://admin.criticalmanufacturing.io/api/1/workspaces/repository/repositories/tools/packages/single' \
              | jq --exit-status 'length == 1 and .[0].isSucceeded == true' > /dev/null
          done
      - name: Verify every binary on GitHub, criticalmanufacturing.io and China
        run: node .github/scripts/release-artifacts.mjs verify "$RELEASE_TAG"

  publish-npm:
    needs: publish-and-verify-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Publish NPM package (if pre-release)
      - name: Publish pre-release NPM package
        run: cd npm && npm publish --tag next
        if: "github.event.release.prerelease"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Publish NPM package (if regular release)
      - name: Publish NPM package
        run: cd npm && npm publish --tag latest && npm dist-tag add "@criticalmanufacturing/portal@$RELEASE_TAG" next
        if: "!github.event.release.prerelease"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
